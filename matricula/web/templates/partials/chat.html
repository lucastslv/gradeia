{% if not mensagens %}
<p class="font-mono text-[11px] uppercase tracking-wider text-slate-400">
  Pergunte sobre oferta, horários ou turmas.
</p>
{% endif %}

{% for mensagem in mensagens %}
  {% if mensagem.role == "user" %}
  <div class="msg-user">{{ mensagem.content }}</div>
  {% else %}
  <div class="chat-md msg-assistente whitespace-pre-wrap">
    {{ mensagem.content|markdown }}
  </div>
  {% endif %}
{% endfor %}
