<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}gradeia{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/chat.js" defer></script>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-white text-slate-900 antialiased">
  <header class="border-b border-slate-300">
    <div class="mx-auto flex max-w-[1440px] items-center justify-between px-6 py-5">
      <a href="/" class="font-mono text-lg font-bold tracking-tight">
        gradeia<span class="cursor-blink text-[#00539F]">_</span>
      </a>
      <span class="hidden font-mono text-[11px] font-medium uppercase tracking-widest text-slate-500 sm:block">
        UFRGS · dados públicos
      </span>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-[1440px] px-6 pb-10">
    <p class="border-t border-slate-200 pt-4 font-mono text-[11px] uppercase leading-relaxed tracking-wider text-slate-400">
      A oferta é consultada na API pública da UFRGS.<br>
      A matrícula é feita no Portal do Aluno.
    </p>
  </footer>
</body>
</html>
